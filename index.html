<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Crypto</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Dashboard Crypto – Monitoraggio Automatico</h1>
        <p>20 asset in osservazione continua</p>
    </header>

    <main>
        <table id="assetTable">
            <thead>
                <tr>
                    <th>Asset</th>
                    <th>Prezzo</th>
                    <th>Trend</th>
                    <th>Volume</th>
                    <th>Momentum</th>
                    <th>Segnale</th>
                </tr>
            </thead>

            <tbody id="assetTableBody">
                <!-- I dati verranno inseriti automaticamente da renderTable.js -->
            </tbody>
        </table>
    </main>

    <footer>
        <p>Dashboard Crypto – Powered by GitHub Pages</p>
    </footer>

    <!-- Moduli -->
   <script type="module" src="script.js"></script>

</body>
</html>
